families:
  - name: neutral_full_body_anchor
    contract: Prioritize full-body readability, stable face read, and clean silhouette over scene atmosphere.
    identity_priority:
      - face
      - bangs
      - ponytail
      - jacket silhouette
      - footwear
    body_framing: three-quarter full-body with both hands visible and shoes readable
    background_policy: pale grey or similarly neutral backdrop with no props or environmental clutter
    suppression: avoid dramatic action, crowding objects, and background story cues
  - name: wardrobe_read_anchor
    contract: Keep outfit category and footwear highly legible so REF continuity can reuse the anchor.
    identity_priority:
      - outfit silhouette
      - outer layer
      - skirt or denim bottom
      - premium everyday footwear
    body_framing: full-body or near-full-body with unobstructed legs and shoes
    background_policy: clean studio-like backdrop with soft floor shadow
    suppression: avoid seated pose, props, and cropped compositions
  - name: continuity_face_anchor
    contract: Preserve facial structure and hairline consistency without sacrificing full-figure matchability.
    identity_priority:
      - eyes
      - jawline
      - hairline
      - ponytail silhouette
    body_framing: slight body turn with direct readable face
    background_policy: neutral backdrop and controlled lighting
    suppression: avoid profile-only angle, harsh glamour lighting, and heavy shadow
  - name: footwear_lock_anchor
    contract: Make lower-body and footwear readable so later REF shots do not drift into barefoot or incompatible footwear.
    identity_priority:
      - footwear
      - calf line
      - hemline
    body_framing: full-body with feet fully visible
    background_policy: uncluttered ground plane and minimal set dressing
    suppression: avoid cut-off feet, seated legs, and obscuring props
