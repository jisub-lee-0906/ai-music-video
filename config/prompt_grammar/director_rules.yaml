default_primary_surface: walkable path

identity_hook_policies:
  optional_small_hook_archetypes:
    - threshold_crossing
    - doorway_handoff
    - window_contact
    - bench_rest
    - brace_pause
  optional_small_hook_variants:
    platform_edge:
      - bridge_motion

surface_overrides:
  by_story_function:
    sidewalk_continuation:
      entry: wet sidewalk edge outside the station
      continuation: wet sidewalk edge
      handoff: wet sidewalk edge
    curb_crossing:
      entry: wet crosswalk
      continuation: wet crosswalk
      handoff: wet crosswalk near the far curb
      payoff: wet crosswalk
    platform_edge:
      continuation: wet platform edge
      handoff: wet platform edge
    threshold_crossing:
      entry: gate threshold
      handoff: station threshold
    gate_pass:
      entry: turnstile lane
  by_archetype:
    window_contact: station window
    bench_rest: wet bench seat
    brace_pause: wet rail

platform_edge_templates:
  start:
    base: She sets the next step along the {surface} with the edge geometry close at her feet.
    bridge_motion: She sets a shorter step along the {surface} with the yellow tactile line close at her feet.
  end:
    base: She takes the next step along the {surface} and keeps driving forward.
    bridge_motion: She takes a crossing step along the {surface} with the yellow tactile line close at her feet and her footprint trail widening behind her.

dominant_action_templates:
  gate_pass:
    entry: She enters the {surface} with one readable forward step.
    handoff: She moves beyond the {surface} and keeps her line into the station path.
  threshold_crossing:
    entry: She sets her line across the {surface} toward the next surface.
    continuation: She keeps one committed step moving through the {surface} toward the next surface.
    handoff: She clears the {surface} and carries the next step into the following route.
  doorway_handoff:
    entry: She reaches the {surface} and commits to the space beyond.
    handoff: She clears the {surface} and carries the next step into the immediate passage.
  curb_crossing:
    entry: She steps in from one side of the {surface} with the road opening ahead of her.
    continuation: She keeps the same crossing stride alive through the middle-right side of the {surface} without falling back to center.
    handoff: She carries the same stride along the right edge of the {surface} with the open road held to her left.
    payoff: She walks away from the {surface} into the wider street at night.
  sidewalk_continuation:
    entry: She steps in from the road-side edge of the {surface} with the route opening beside her.
    continuation: She carries the same stride along the {surface} with the road still riding to her right.
    handoff: She sets the next sidewalk-side stride on the {surface} with the road clearly to her right.
  stair_descent:
    entry: She steps down the {surface} with one continuous handrail contact.
    continuation: She keeps descending the {surface} with the handrail still guiding her line.
    handoff: She lands the next step on the {surface} and keeps descending.
  passage_compression:
    entry: She keeps close to the {surface} and starts moving one beat farther through it.
    continuation: She keeps close to the {surface} and moves one beat farther through it.
    handoff: She compresses one more step through the {surface} and carries it forward.
  window_contact:
    entry: She keeps one empty palm on the {surface} and steadies her breath without fully stopping.
    handoff: She lets the empty palm lift from the lower rail of the {surface} and keeps moving past the edge.
  bench_rest:
    entry: She sits on the {surface} with one foot still planted on the ground as if she could rise again.
    pressure: She sits on the {surface} for one compressed beat with one foot still planted on the ground as if she could rise again.
    handoff: She leans forward from the end of the {surface} and gathers the next step without fully settling.
  brace_pause:
    entry: She pauses at the {surface} with one hand braced on the metal bar.
    pressure: She braces at the {surface} with one hand fixed on the metal bar while the next step waits.
    handoff: She lets the braced contact loosen at the {surface} and keeps the next step ready.
  platform_edge:
    continuation: She keeps the same line along the {surface} with the edge geometry still close at her feet.
    handoff: She sets the next committed step along the {surface} with the edge geometry close at her feet.

continuity_templates:
  gate_pass:
    entry: She passes through the {surface} and lands just inside the station.
    handoff: She moves beyond the {surface} and lands on the next pavement.
  threshold_crossing:
    entry: She clears the {surface} and lands beyond it on the next surface.
    continuation: She carries the threshold crossing one beat farther beyond the {surface} into the next surface.
    handoff: She lands beyond the {surface} and carries the route forward.
  doorway_handoff:
    entry: She carries the next step beyond the {surface} into the immediate passage.
    handoff: She leaves the {surface} behind and keeps the next step inside the passage.
  curb_crossing:
    entry: She carries the crossing one beat farther from the entry side of the {surface}.
    continuation: She crosses one beat farther through the middle-right side of the {surface} and keeps the crossing live.
    handoff: She keeps to the right edge of the {surface} and leaves the next crossing state already formed with the open road held to her left.
    payoff: She leaves the {surface} behind and keeps walking away as the wider street opens around her.
  sidewalk_continuation:
    entry: She carries the route one readable stride farther from the road-side edge of the {surface} and leaves the road clearly beside her.
    continuation: She keeps the same stride on the {surface} and moves one step farther with the road still riding to her right.
    handoff: She lands the next sidewalk-side stride on the {surface} and keeps the road clearly to her right.
  stair_descent:
    entry: She lands one step lower on the {surface} and keeps descending.
    continuation: She keeps descending the {surface} and drops one more step lower.
    handoff: She takes one more step down the {surface} and carries the descent forward.
  passage_compression:
    entry: She keeps close to the route and compresses one more step forward.
    continuation: She keeps close to the route and moves one compressed step farther.
    handoff: She clears the tightest part of the route and carries the compression forward.
  window_contact:
    entry: She lets the palm contact soften on the {surface} and leaves the next commitment ready.
    handoff: She lets the empty palm lift from the lower rail of the {surface} and leaves the next step moving past the edge.
  bench_rest:
    entry: She stays on the {surface} with one foot planted on the ground and the route still waiting in front of her.
    pressure: She holds the compressed seat on the {surface} for one beat, still planted to rise again.
    handoff: She tips forward from the end of the {surface} and leaves the rise already forming before the cut.
  brace_pause:
    entry: She keeps one hand braced on the {surface} and leaves the pause able to break at once.
    pressure: She holds one beat at the {surface} with the braced contact still carrying pressure forward.
    handoff: She loosens the braced contact at the {surface} and leaves the next step ready to resume.
  platform_edge:
    continuation: She takes one more step along the {surface} and keeps the edge line tight at her feet.
    handoff: She lands the next step along the {surface} and leaves the forward route already committed.

content_trace_defaults:
  by_archetype:
    stair_descent: one hand sliding along the handrail
    passage_compression: one hand trailing the rail
  by_archetype_variant_story:
    platform_edge:
      bridge_motion:
        pressure: footprint trail widening behind her
