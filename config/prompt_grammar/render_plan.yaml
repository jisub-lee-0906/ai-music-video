wan_transition_family:
  threshold_or_release_archetypes:
    - threshold_crossing
    - doorway_handoff
    - gate_pass
    - curb_crossing
  descent_archetypes:
    - stair_descent
    - ramp_descent
  compression_archetypes:
    - passage_compression
    - brace_pause
    - platform_edge

rule_precedence:
  ref: golden_structures > ref_archetypes > story_visual_intent > flux2_prompting.ref
