structures:
  - name: intro_entry_gate
    story_function: entry
    ref_archetype: gate_pass
    preferred_surface: turnstile lane
    prompt_contract: Keep the entry on the turnstile or gate crossing and land immediately inside the station.
    preferred_pattern: same heroine + turnstile or gate crossing + first step inside the station
    start_shape: She enters the turnstile lane with one readable forward step.
    end_shape: She passes through the turnstile lane and lands just inside the station.
    wan_shape: She steps through the turnstile lane into the station and lands on the station side.
  - name: bridge_platform_motion
    story_function: pressure
    ref_archetype: platform_edge
    variant: bridge_motion
    preferred_surface: wet platform edge
    prompt_contract: Keep the beat on the wet platform edge with the yellow tactile line close at her feet, a readable shortened or crossing step, and a visible footprint trail behind her.
    preferred_pattern: same heroine + wet platform edge + yellow tactile line near feet + crossing or shortened step + footprints widening behind
    start_shape: She sets a shorter step along the wet platform edge with the yellow tactile line close at her feet.
    end_shape: She takes a crossing step along the wet platform edge with the yellow tactile line close at her feet and her footprint trail widening behind her.
    wan_shape: She keeps the same crossing step on the wet platform edge while the footprint trail widens behind her.
  - name: final_release_crosswalk
    story_function: payoff
    ref_archetype: curb_crossing
    preferred_surface: wet crosswalk
    prompt_contract: Keep the release on a literal wet crosswalk, but make the payoff read as a walk-away departure into the wider street rather than another centered crossing stride.
    preferred_pattern: same heroine + wet crosswalk + walks away from the crossing + wider street opens around her
    start_shape: She walks away from the wet crosswalk into the wider street at night.
    end_shape: She moves away from the wet crosswalk at night, the wider street opening around her as she recedes.
    wan_shape: She keeps moving away from the wet crosswalk while the wider street opens around her.
  - name: final_release_crosswalk_handoff
    story_function: handoff
    ref_archetype: curb_crossing
    preferred_surface: wet crosswalk
    prompt_contract: Keep the middle release beat inside the same wet crosswalk family, but use right-edge curb blocking so it stays distinct from both the left-edge entry and the away-from-camera payoff.
    preferred_pattern: same heroine + right edge of the wet crosswalk + same stride carries forward + open road held to her left
    start_shape: She carries the same stride along the right edge of the wet crosswalk at night.
    end_shape: She carries the same stride along the right edge of the wet crosswalk at night, the open road holding to her left.
    wan_shape: She keeps the same stride along the right edge of the wet crosswalk while the open road holds to her left.
  - name: final_release_crosswalk_continuation
    story_function: continuation
    ref_archetype: curb_crossing
    preferred_surface: wet crosswalk
    prompt_contract: Keep the continuation inside the same crosswalk, but push the body off perfect center so it reads as a live crossing rather than a reset pose.
    preferred_pattern: same heroine + middle-right side of the wet crosswalk + same stride alive
    start_shape: She keeps the same stride alive through the middle-right side of the wet crosswalk at night.
    end_shape: She crosses through the middle-right side of the wet crosswalk at night, keeping the same stride alive.
    wan_shape: She keeps the same stride alive through the middle-right side of the wet crosswalk.
  - name: final_release_crosswalk_entry
    story_function: entry
    ref_archetype: curb_crossing
    preferred_surface: wet crosswalk
    prompt_contract: Start the final release by entering the wet crosswalk from the far left edge so the release begins as an unmistakable off-center crossing event rather than a generic centered walk.
    preferred_pattern: same heroine + steps in from the far left edge of the wet crosswalk + most of the road stays open ahead
    start_shape: She steps in from the far left edge of the wet crosswalk at night.
    end_shape: She steps in from the far left edge of the wet crosswalk at night, leaving most of the road open ahead of her.
    wan_shape: She keeps entering from the far left edge of the wet crosswalk as most of the road stays open ahead.
  - name: pre_handoff_threshold
    story_function: handoff
    ref_archetype: threshold_crossing
    variant: passage_exit
    preferred_surface: station threshold
    prompt_contract: Keep the handoff on a literal station threshold into a wet passage; avoid decorative doorway framing and keep the next step already committed beyond it.
    preferred_pattern: same heroine + station threshold + wet passage beyond + next step already committed
    start_shape: She clears the station threshold into the wet passage, her next step already committed beyond it.
    end_shape: She leaves the station threshold behind and keeps the next step inside the wet passage.
    wan_shape: She clears the station threshold and carries the next step into the wet passage beyond.
  - name: verse_window_contact
    story_function: handoff
    ref_archetype: window_contact
    preferred_surface: station window
    prompt_contract: Keep the beat on a literal station-side window or glass edge with one hand trailing the metal edge; keep the contact readable and the movement alive.
    preferred_pattern: same heroine + station window + one hand trailing the metal edge + forward continuation
    start_shape: She keeps close to the station window and moves forward, one hand trailing the metal edge.
    end_shape: She lets the contact slide off the station window and keeps moving past the edge.
    wan_shape: She keeps close to the station window while the contact trails off into the next step.
  - name: pre_contact_before_commit
    story_function: entry
    ref_archetype: window_contact
    preferred_surface: station window
    prompt_contract: Hold the pre-commit beat on a literal glass contact near the wider opening; keep the body ready to continue and do not let the shot collapse into a static pose.
    preferred_pattern: same heroine + one palm on the station window + breath steadied without fully stopping + next commit imminent
    start_shape: She keeps one palm on the station window and steadies her breath without fully stopping.
    end_shape: She lets the palm contact soften on the station window and leaves the threshold commitment ready.
    wan_shape: She keeps one palm on the station window while the contact softens into the next commitment.
  - name: sidewalk_route_entry
    story_function: entry
    ref_archetype: sidewalk_continuation
    preferred_surface: wet sidewalk edge outside the station
    prompt_contract: Start the route on a literal sidewalk edge outside the station and keep the road clearly to one side so it does not flatten into a platform or centered road walk.
    preferred_pattern: same heroine + wet sidewalk edge outside the station + first committed stride + road opening beside her
    start_shape: She steps in from the road-side edge of the wet sidewalk edge outside the station at night.
    end_shape: She takes the first committed stride from the road-side edge of the wet sidewalk edge outside the station at night, the road opening beside her.
    wan_shape: She keeps entering from the road-side edge of the wet sidewalk edge outside the station while the road opens beside her.
  - name: sidewalk_route_continuation
    story_function: continuation
    ref_archetype: sidewalk_continuation
    preferred_surface: wet sidewalk edge
    prompt_contract: Keep the continuation on a literal wet sidewalk edge with the road still riding to one side; avoid road-center walking or platform drift.
    preferred_pattern: same heroine + wet sidewalk edge + same stride carrying forward + road still riding to her right
    start_shape: She keeps the same stride along the wet sidewalk edge at night.
    end_shape: She carries the same stride along the wet sidewalk edge at night, the road still riding to her right.
    wan_shape: She keeps the same stride on the wet sidewalk edge while the road stays to her right.
  - name: sidewalk_route_handoff
    story_function: handoff
    ref_archetype: sidewalk_continuation
    preferred_surface: wet sidewalk edge
    prompt_contract: Keep the handoff on the same wet sidewalk edge and make the next state already formed without dropping her into the middle of the road.
    preferred_pattern: same heroine + next stride on the wet sidewalk edge + curb held under the near side + road clearly to her right
    start_shape: She sets the next sidewalk-side stride on the wet sidewalk edge at night, the road clearly to her right.
    end_shape: She lands the next sidewalk-side stride on the wet sidewalk edge at night, the next state already formed with the road clearly to her right.
    wan_shape: She keeps the next sidewalk-side stride alive with the road staying clearly to her right.
  - name: verse_bench_pause
    story_function: entry
    ref_archetype: bench_rest
    preferred_surface: wet bench end
    prompt_contract: Put the beat on a literal wet bench end with one foot still planted so the seated state reads as a temporary compression rather than a completed rest.
    preferred_pattern: same heroine + wet bench end + one foot still planted + ready to rise again
    start_shape: She sits at the end of the wet bench, one foot still planted as if she could rise again.
    end_shape: She stays at the end of the wet bench with one foot planted and the route still waiting in front of her.
    wan_shape: She holds at the end of the wet bench with one foot planted while the rise remains possible.
  - name: verse_bench_rise_ready
    story_function: handoff
    ref_archetype: bench_rest
    variant: rise_ready
    preferred_surface: wet bench end
    prompt_contract: Keep the handoff at the bench end but tip the body forward so the next step already reads as forming before she fully stands.
    preferred_pattern: same heroine + wet bench end + body tipped forward + rise already forming
    start_shape: She leans forward from the end of the wet bench and gathers her next step without fully settling.
    end_shape: She tips forward from the end of the wet bench and leaves the rise already forming before the cut.
    wan_shape: She leans forward from the end of the wet bench while the rise gathers into the next step.
  - name: bridge_bench_compression
    story_function: pressure
    ref_archetype: bench_rest
    preferred_surface: wet bench end
    prompt_contract: Use a literal wet bench end for the bridge compression so the beat reads as a brief lived pause inside the world, not another route step or a dead static tableau.
    preferred_pattern: same heroine + wet bench end + one compressed seated beat + one foot still planted
    start_shape: She sits at the end of the wet bench for one compressed beat, one foot still planted as if she could rise again.
    end_shape: She holds the compressed seat at the end of the wet bench for one beat, still planted to rise again.
    wan_shape: She holds one compressed seated beat at the end of the wet bench while the rise stays possible.
  - name: final_platform_push
    story_function: handoff
    ref_archetype: platform_edge
    variant: bridge_motion
    preferred_surface: platform edge
    prompt_contract: Keep the beat on the same wet platform edge at night with the yellow tactile line near her feet and the track still running beside her; do not let it drift into a new bridge or roadway world.
    preferred_pattern: same heroine + wet platform edge at night + yellow tactile line near feet + track still running beside her + longer forward step
    start_shape: She sets the next longer step along the wet platform edge at night, keeping close to the track beside her.
    end_shape: She lands the next longer step along the wet platform edge at night, the next state already formed while the track still runs beside her.
    wan_shape: She keeps close to the wet platform edge at night and lands the next longer step while the track still runs beside her.
