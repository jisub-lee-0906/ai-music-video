audio:
  language: ko
  tags:
    - fierce k-pop pop-rap
    - young adult female solo vocal
    - bold charismatic lead vocal
    - hard-hitting drums
    - gritty synth bass
    - swagger hook
    - sharp chant accents
    - rebellious pop energy
    - dark glossy finish
  brief: >
    Fierce pop-forward K-pop for a young adult female solo singer, with hard-hitting drums,
    gritty synth bass, bold chant accents, and a hook that lands with swagger and attitude. Keep
    the arrangement dark-glossy, forceful, and performance-led, with strong contrast between
    contained verses and explosive returns.
  hook_brief: >
    Build the hook around one commanding phrase and make it punchy, replayable, and natural in
    Korean. The hook should feel rebellious, charismatic, and instantly performable rather than
    soft, wistful, or overly cute.
visual:
  brief: >
    A rebellious diva music video with a young adult East Asian heroine, strong silhouette,
    dark-gloss styling, industrial shine, shadowed thresholds, hard-lit passages, and dominant
    open lanes. Keep the heroine photogenic, powerful, and controlled, with attitude-first
    presence rather than elegant restraint.
  negative: >
    Avoid soft romance drift, timid posing, luxury-only prettiness, cluttered props, pastel
    sweetness, and disconnected locations that dilute the attitude line.
mv:
  story_world: >
    The video should feel like one charged after-dark world built from recurring environment
    families: shadowed thresholds, hard-lit passages, industrial platforms, and dominant open
    lanes. The same heroine and the same rebellious charge should drive the whole piece.
  action_vocabulary: >
    Prefer readable assertive actions: stepping into center, turning with attitude, holding a
    challenge stare, driving forward through a lane, pausing in hard shadow, and landing a final
    look. Keep motion crisp, controlled, and forceful rather than chaotic or stunt-heavy.
  payoff_style: >
    The final return should feel like full command: hardest eye line, strongest posture, sharper
    light contrast, and a sense that the heroine has taken complete control of the frame.
  avoid: >
    Avoid polite softness, static glamour for its own sake, random narrative detours, timid
    endings, and any drift toward cute idol sweetness.
