audio:
  language: ja
  tags:
    - japanese anime rock
    - young adult female solo vocal
    - bright urgent lead vocal
    - driving electric guitar
    - live drum energy
    - melodic bass line
    - anthemic chorus hook
    - emotional lift
    - widescreen band feel
  brief: >
    High-energy Japanese anime-rock for a young adult female solo singer, with driving electric
    guitar, live drums, melodic bass, and a sharp hook that opens fast and lands hard. Keep the
    arrangement bright, urgent, and emotionally direct, with clear lift into the chorus and a
    strong forward-running pulse instead of loose jam-band drift.
  hook_brief: >
    Build the hook around one vivid emotional image and make it immediate, singable, and
    title-worthy in natural Japanese. The hook should feel bold, youthful, and cathartic rather
    than vague, sleepy, or overly delicate.
visual:
  brief: >
    A vivid anime-rock heroine music video with a young adult East Asian lead, sharp styling,
    wind-cut motion, streaked practical light, reflective thresholds, elevated passages, and open
    run lanes. Keep the heroine photogenic, energetic, and consistent, with bright determined
    presence rather than fashion-editorial stillness.
  negative: >
    Avoid heavy nightclub glamour, luxury fashion drift, sluggish posing, random prop clutter,
    soft passive staging, and disconnected environments that break the forward rush.
mv:
  story_world: >
    The video should feel like one continuous emotional charge through recurring urban-night
    environment families: elevated passages, reflective thresholds, rooftop edges, and open run
    lanes. The same heroine and the same momentum should carry through the whole piece.
  action_vocabulary: >
    Prefer readable energetic actions: stepping into wind, running a lane line, turning at a
    threshold, bracing at a rail, lifting the chin into light, and holding a forward stare. Keep
    motion physically simple but urgent rather than chaotic or fight-scene heavy.
  payoff_style: >
    The final return should feel like full emotional breakthrough: stronger eye contact, wider
    body line, brighter backlight, and a sense that the heroine has finally outrun hesitation.
  avoid: >
    Avoid sleepy wandering, static beauty posing, forced cuteness, random spectacle, and endings
    that feel muted instead of earned and open.
