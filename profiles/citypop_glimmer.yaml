# 세련된 야경과 반짝이는 도시 무드의 시티팝 및 그루비한 J-Pop에 최적화
# Suggested Filename: citypop_glimmer.yaml
audio:
  language: ja
  tags:
    - japanese city pop
    - young adult female solo vocal
    - fresh elegant lead vocal
    - glossy electric piano
    - tasteful chorus guitar
    - warm analog synth pad
    - fretless bass groove
    - subtle disco bounce
    - soft backing harmonies
    - light string accents
    - smooth melodic hook
    - elegant city-pop groove
  brief: >
    Retro Japanese city-pop for a young adult female solo singer, with glossy electric piano,
    tasteful chorus guitar, warm analog synth pad, fretless bass groove, soft backing harmonies,
    and a subtle disco bounce. Keep the arrangement fresh, elegant, and polished, with a
    smooth melodic lift and clear mainstream appeal instead of modern trap aggression or generic
    alt-pop drift.
  hook_brief: >
    Build the hook from one concrete late-night city image and make it title-worthy, memorable
    after one listen, and singable in natural Japanese. The hook should feel adult, graceful,
    and emotionally inevitable rather than slogan-like or generic.
visual:
  brief: >
    A photorealistic cinematic city-pop nightlife music video with a young adult East Asian
    heroine, youthful elegance, and a softly glamorous camera-ready presence, wet pavement
    reflections, reflective thresholds, lit passages, and open night lanes. Keep the mood
    polished, graceful, and spatially readable, with clean lane depth and controlled center
    framing before extra motion. Drive it with:
    whip pan reveals, snap zoom accents, match-cut motion echoes, selective extreme close-ups,
    restrained strobe glints, high-contrast lighting, and dynamic shadows. Favor poised stillness
    punctuated by elegant turns rather than constant movement.
  negative: >
    Avoid futuristic sci-fi tone, cheap club styling, noisy streetwear drift, random location
    hopping, heavy prop emphasis, anime or 2D stylization, typography, text, subtitles,
    watermarks, logo, and UI overlay.
mv:
  story_world: >
    The video should feel like one late-night emotional passage through a small set of recurring
    city-night environment families: reflective thresholds, lit passages, sheltered edges, and
    open lanes. The same night, the same heroine, and the same emotional weather should carry
    through the whole piece.
  action_vocabulary: >
    Prefer readable small actions: slowing at a threshold, passing through a lit passage, pausing
    near an open lane, checking a reflection, stepping forward into clear light, turning the
    shoulders softly into frame, and holding a gaze. Keep motion graceful and physically simple
    rather than plot-heavy, fidgety, or theatrical. Favor actions that can resolve as one clean
    workflow-ready clause instead of long narrative behavior.
  payoff_style: >
    The final return should feel like emotional arrival inside the same city night: clearer eye
    contact, more open posture, brighter reflections, stronger contrast, a match-cut cadence
    through the last phrases, a controlled whip pan release, and one elegant extreme close-up.
  outro_feel: >
    End on a final held look or small forward step that seals the night decisively, leaving a
    polished after-image that feels locked in rather than softly fading away.
  avoid: >
    Avoid random spectacle, abrupt geography changes, disconnected glam shots, and endings that
    feel fragmentary.
