audio:
  language: ja
  tags:
    - japanese city pop
    - young adult female solo vocal
    - fresh elegant lead vocal
    - glossy electric piano
    - tasteful chorus guitar
    - warm analog synth pad
    - fretless bass groove
    - subtle disco bounce
    - soft backing harmonies
    - light string accents
    - smooth melodic hook
    - elegant city-pop groove
  brief: >
    Retro Japanese city-pop for a young adult female solo singer, with glossy electric piano,
    tasteful chorus guitar, warm analog synth pad, fretless bass groove, soft backing harmonies,
    and a subtle disco bounce. Keep the arrangement fresh, elegant, and polished, with a
    smooth melodic lift and clear mainstream appeal instead of modern trap aggression or generic
    alt-pop drift.
  hook_brief: >
    Build the hook from one concrete late-night city image and make it title-worthy, memorable
    after one listen, and singable in natural Japanese. The hook should feel adult, graceful,
    and emotionally inevitable rather than slogan-like or generic.
audio_ending_policy:
  ending_mode: glow_fade
  final_chorus_required: true
  outro_required: true
  ending_energy_drop: medium
  ending_vocal_density: low
  ending_tags:
    - soft outro
    - warm final resolve
    - gentle fade out
visual:
  brief: >
    Adult Japanese city-pop at night. Keep the mood polished, wistful, and quietly elegant.
    Favor reflective curb lines, train-window traces, sheltered sidewalks, lit passages, and a
    compact recurring city block that feels intimate rather than spectacular.
  negative: >
    Avoid cheap club energy, loud sci-fi drift, random set-hopping, prop clutter, heavy glamour
    posing, or aggressive action that breaks the mature city-pop tone.
mv:
  story_world: >
    One late-night city walk through repeating families of places: covered lanes, train windows,
    curb edges, crosswalk light, quiet storefront glow, and small reflective thresholds. The
    same heroine and the same night carry the whole piece.
  action_vocabulary: >
    Prefer small readable beats: slowing at a corner, passing a lit gate, glancing at a window,
    heel rhythm on wet pavement, a soft shoulder turn, a held pause under light, and one clean
    image event at a time.
  payoff_style: >
    The final return should feel like emotional arrival inside the same city night. Let the
    recurring reflections and lanes resolve into one calm, brighter image system with heroine
    presence inside it rather than pure face-only payoff.
  outro_feel: >
    End on a warm residual image, like the city light keeps glowing for a moment after she moves
    through it.
  avoid: >
    Avoid abrupt geography breaks, disconnected glam shots, noisy spectacle, or endings that feel
    crowded instead of graceful.
visual_policy:
  visual_mode: balanced
  continuity_mode: same_heroine
  face_policy: payoff_only
  shot_bias: environment
  ref_policy: identity_sensitive_only
  closeup_density: low
  motion_density: medium
  geography_mode: recurring_families
  anchor_mode: shot_anchor_required
  direct_face_sections:
    - Final Chorus
  priority_sections:
    - Final Chorus
    - Chorus 2
    - Chorus 1
  hero_shot_types:
    - EMOTION_CLOSE
    - CHAR_MASTER
  max_direct_face_ratio: 0.12
