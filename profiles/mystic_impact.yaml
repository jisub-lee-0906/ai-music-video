    lacquer-black passageways, and open ceremonial lanes. The same heroine and the same sense of
    supernatural authority should carry through the whole piece.
  action_vocabulary: >
    Prefer readable ritual-impact actions: stepping across a marked threshold, turning with a
    controlled sleeve or coat sweep, holding a mystical stare, advancing through a corridor like
