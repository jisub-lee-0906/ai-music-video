# 동양적인 신비로움과 현대적인 록 비트가 결합된 미스테리하고 강렬한 곡에 최적화
# Suggested Filename: mystic_impact.yaml
audio:
  language: ko
  tags:
    - mystical east asian rock pop
    - korean female solo vocal
    - intense expressive lead vocal
    - fast precise live drums
    - dark electric guitar drive
    - korean traditional melodic color
    - taepyeongso and string ornament feel
    - ritual tension
    - explosive chorus impact
    - j-rock k-pop hybrid energy
  brief: >
    A fast, intense Korean hybrid track that fuses mystical East Asian melodic color with a
    hard-driving rock rhythm section, precise live drums, dark electric guitar force, and a
    chorus that lands like a ritual strike. Keep the arrangement urgent, dramatic, and exact,
    balancing traditional melodic contour with modern J-Rock and K-Pop impact rather than soft
    ballad drift or generic metal excess.
  hook_brief: >
    Build the hook around one unforgettable fatalistic image and make it immediate, sharp, and
    singable in natural Korean. The hook should feel mythic, dangerous, and emotionally
    overwhelming rather than vague, cute, or melodically sleepy.
visual:
  brief: >
    A photorealistic cinematic mystical East Asian dark-impact music video with an East Asian
    heroine, a mystical gaze, an elegant lethal-on-camera presence, deep-shadow temple corridors,
    gothic thresholds, lacquered black floors, ritual spaces with traditional motifs, and
    crimson-violet light chambers. Drive the
    piece with kinetic live-action force: whip pan transitions, snap zoom pressure, strobe
    bursts, match-cut body echoes, extreme close-up stare impacts, high-contrast lighting, and
    dynamic shadows. Favor iconic held poses, threshold turns, and ritualized camera pressure
    over literal running or supernatural chaos.
  negative: >
    Avoid flat fantasy cosplay, cheap historical costume drift, cartoon stylization, random
    props, bright comedy tone, messy crowd clutter, weak lighting, typography, text, subtitles,
    watermarks, logo, UI overlay, and distorted rendering.
mv:
  story_world: >
    The video should feel like one continuous ritual night world built from recurring environment
    families: shadowed temple thresholds, gothic East Asian halls, carved ritual chambers,
    lacquer-black passageways, and open ceremonial lanes. The same heroine and the same sense of
    supernatural authority should carry through the whole piece.
  action_vocabulary: >
    Prefer readable ritual-impact actions: stepping across a marked threshold, turning with a
    controlled sleeve or coat sweep, holding a mystical stare, advancing through a corridor like
    a verdict, pausing under hard crimson light, striking a pose that match cuts into the next
    space, and landing a final still command. Keep motion crisp, elegant, and forceful rather
    than chaotic, stunt-heavy, melodramatically theatrical, or overloaded with occult spectacle.
  payoff_style: >
    The final return should feel like total mystical impact: hardest eye line, strongest
    silhouette, crimson-violet contrast, deeper shadows, whip pan escalations, snap zoom impact,
    strobe bursts, match-cut ritual continuity, and one extreme close-up strike.
  outro_feel: >
    End with a final image that feels like a verdict has been sealed, elegant and absolute,
    rather than fading into loose residue.
  avoid: >
    Avoid soft historical romance drift, campy supernatural clichés, random monster imagery,
    disconnected locations, passive body language, and diluted endings.
