audio:
  language: ko
  tags:
    - mystical east asian rock pop
    - korean female solo vocal
    - intense expressive lead vocal
    - fast precise live drums
    - dark electric guitar drive
    - korean traditional melodic color
    - taepyeongso and string ornament feel
    - ritual tension
    - explosive chorus impact
    - j-rock k-pop hybrid energy
  brief: >
    A fast, intense Korean hybrid track that fuses mystical East Asian melodic color with a
    hard-driving rock rhythm section, precise live drums, dark electric guitar force, and a
    chorus that lands like a ritual strike. Keep the arrangement urgent, dramatic, and exact,
    balancing traditional melodic contour with modern J-Rock and K-Pop impact rather than soft
    ballad drift or generic metal excess.
  hook_brief: >
    Build the hook around one unforgettable fatalistic image and make it immediate, sharp, and
    singable in natural Korean. The hook should feel mythic, dangerous, and emotionally
    overwhelming rather than vague, cute, or melodically sleepy.
audio_ending_policy:
  ending_mode: hard_stop
  final_chorus_required: true
  outro_required: false
  ending_energy_drop: low
  ending_vocal_density: medium
  ending_tags:
    - ritual resolve
    - sealed ending
    - final strike
visual:
  brief: >
    Mystical night impact with a rhythm-game and visual-MV sensibility. Favor temple thresholds,
    lacquer-dark passages, carved chamber edges, ceremonial corridors, and crimson-violet motif
    systems over heroine-only coverage.
  negative: >
    Avoid campy occult clutter, costume-play historical drift, bright comedy tone, random props,
    crowd noise, or fantasy excess that breaks the ritual severity.
mv:
  story_world: >
    One ritual night world built from temple thresholds, carved halls, chamber lanes, lacquer
    floors, and shadowed ceremonial passages.
  action_vocabulary: >
    Prefer ceremonially clear beats: threshold crossing, sleeve turn, ritual stare, corridor
    advance, crimson-light pause, matched pose, and final still command.
  payoff_style: >
    The final return should feel like a sealed verdict: hardest silhouette, strongest crimson-
    violet contrast, heroine presence under full ritual pressure, and a decisive final strike.
  outro_feel: >
    End on an image that feels like the ritual has completed and cannot be reversed.
  avoid: >
    Avoid soft historical romance drift, random monster imagery, passive body language,
    disconnected locations, or endings that weaken the sense of sealed impact.
visual_policy:
  visual_mode: balanced
  continuity_mode: same_heroine
  face_policy: payoff_only
  shot_bias: object_symbol
  ref_policy: endpoints
  closeup_density: low
  motion_density: high
  geography_mode: recurring_families
  anchor_mode: shot_anchor_required
  visual_mv_mode: bga_event
  subject_exposure: selective
  motif_density: high
  graphic_event_density: high
  environment_event_density: high
  visual_payoff_mode: system_peak
  reflection_usage: selected_only
  palette_bias: ritual_crimson
  motif_families:
    - gate talisman
    - lantern band
    - lacquer floor
    - ritual shadow
    - carved pillar
    - sleeve edge
    - incense line
    - seal mark
  preferred_composition_families:
    - asymmetrical poster crop
    - low horizon silhouette
    - floating object field
    - offset silhouette crop
    - isolated small figure
    - sticker-cluster layout
  disfavored_composition_families:
    - split reflection diptych
    - centered two-body
    - bilateral symmetry
    - mirrored-face split
  direct_face_sections:
    - Final Chorus
  priority_sections:
    - Final Chorus
    - Chorus 2
    - Bridge
  hero_shot_types:
    - CHAR_MASTER
    - EMOTION_CLOSE
  max_direct_face_ratio: 0.1
