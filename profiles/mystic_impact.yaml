    space, and landing a final still command. Keep motion crisp, elegant, and forceful rather
    than chaotic, stunt-heavy, melodramatically theatrical, or overloaded with occult spectacle.
  payoff_style: >
    The final return should feel like total mystical impact in photorealistic cinematic
    live-action: hardest eye line, strongest silhouette, crimson-and-violet high contrast
    lighting, deeper dynamic shadows, whip pan escalations, snap zoom impact, strobe lighting
    bursts, match cut ritual continuity, and an extreme close-up strike that makes the heroine
