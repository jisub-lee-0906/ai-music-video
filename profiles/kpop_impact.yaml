# 강렬한 비트와 반항적인 태도가 돋보이는 K-Pop 힙합 및 다크한 퍼포먼스 곡에 최적화
# Suggested Filename: kpop_impact.yaml
audio:
  language: ko
  tags:
    - fierce k-pop pop-rap
    - young adult female solo vocal
    - bold charismatic lead vocal
    - hard-hitting drums
    - gritty synth bass
    - swagger hook
    - sharp chant accents
    - rebellious pop energy
    - dark glossy finish
  brief: >
    Fierce pop-forward K-pop for a young adult female solo singer, with hard-hitting drums,
    gritty synth bass, bold chant accents, and a hook that lands with swagger and attitude. Keep
    the arrangement dark-glossy, forceful, and performance-led, with strong contrast between
    contained verses and explosive returns.
  hook_brief: >
    Build the hook around one commanding phrase and make it punchy, replayable, and natural in
    Korean. The hook should feel rebellious, charismatic, and instantly performable rather than
    soft, wistful, or overly cute.
visual:
  brief: >
    A photorealistic cinematic rebellious diva music video with a young adult East Asian heroine,
    strong silhouette, dark-gloss styling, a fierce star-grade camera presence, industrial shine,
    shadowed thresholds, hard-lit passages, and dominant open lanes. Push maximum kinetic tension with whip pan lane attacks,
    snap zoom pressure, strobe hits, match-cut body punctuation, extreme close-up challenge
    stares, high-contrast lighting, and dynamic shadows. Favor commanding center holds, hard
    turns, stop-start pressure, and confrontational pose changes over constant forward charging.
    Keep the frame readable and center-dominant before adding aggression.
  negative: >
    Avoid soft romance drift, timid posing, luxury-only prettiness, cluttered props, pastel
    sweetness, disconnected locations, anime or 2D stylization, typography, text, subtitles,
    watermarks, logo, and UI overlay.
mv:
  story_world: >
    The video should feel like one charged after-dark world built from recurring environment
    families: shadowed thresholds, hard-lit passages, industrial platforms, and dominant open
    lanes. The same heroine and the same rebellious charge should drive the whole piece.
  action_vocabulary: >
    Prefer readable assertive actions: stepping into center, turning with attitude, holding a
    challenge stare, cutting across a lane, pausing in hard shadow, snapping into a new pose, and
    landing a final look. Keep motion crisp, controlled, and forceful rather than chaotic,
    repetitive lane-running, or stunt-heavy. Favor single-impact clauses rather than stacked
    performance instructions.
  payoff_style: >
    The final return should feel like full command: hardest eye line, strongest posture, sharper
    contrast, heavier shadows, whip pan escalations, snap zoom impact, strobe bursts, and an
    extreme close-up strike.
  outro_feel: >
    End with one last attitude-heavy image that closes the lane on her terms and leaves the
    frame under pressure, like the ending has been slammed shut instead of tapering off.
  avoid: >
    Avoid polite softness, static glamour for its own sake, random narrative detours, timid
    endings, and drift toward cute idol sweetness.
