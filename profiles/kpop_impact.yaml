audio:
  language: ko
  tags:
    - fierce k-pop pop-rap
    - young adult female solo vocal
    - bold charismatic lead vocal
    - hard-hitting drums
    - gritty synth bass
    - swagger hook
    - sharp chant accents
    - rebellious pop energy
    - dark glossy finish
  brief: >
    Fierce pop-forward K-pop for a young adult female solo singer, with hard-hitting drums,
    gritty synth bass, bold chant accents, and a hook that lands with swagger and attitude. Keep
    the arrangement dark-glossy, forceful, and performance-led, with strong contrast between
    contained verses and explosive returns.
  hook_brief: >
    Build the hook around one commanding phrase and make it punchy, replayable, and natural in
    Korean. The hook should feel rebellious, charismatic, and instantly performable rather than
    soft, wistful, or overly cute.
audio_ending_policy:
  ending_mode: hard_stop
  final_chorus_required: true
  outro_required: false
  ending_energy_drop: low
  ending_vocal_density: full
  ending_tags:
    - big final chorus
    - final strike
    - slammed-shut ending
visual:
  brief: >
    Fierce dark-gloss K-pop with industrial thresholds, hard-lit passages, dominant lanes, and
    confrontational stage pressure. Keep it sharp, clean, and forceful rather than messy or cute.
  negative: >
    Avoid soft romance drift, luxury-only prettiness, pastel sweetness, cluttered props, timid
    posing, or disconnected spaces that dilute the pressure.
mv:
  story_world: >
    One charged after-dark world built from hard-lit passages, industrial platforms, shadowed
    thresholds, and open lanes that feel built for confrontation.
  action_vocabulary: >
    Prefer readable assertive beats: step to center, challenge stare, lane cut, attitude turn,
    hard-shadow pause, pose snap, and final look.
  payoff_style: >
    The final return should feel like full command: hardest eye line, strongest posture, heavier
    contrast, and a clean final strike that closes the space on her terms.
  outro_feel: >
    End with one last forceful image that feels slammed shut, not softened.
  avoid: >
    Avoid polite softness, static glamour for its own sake, random detours, timid endings, or
    cute-idol drift.
visual_policy:
  visual_mode: character_heavy
  continuity_mode: same_heroine
  face_policy: selective
  shot_bias: performance
  ref_policy: identity_sensitive_only
  closeup_density: medium
  motion_density: high
  geography_mode: recurring_families
  anchor_mode: shot_anchor_required
  direct_face_sections:
    - Chorus 1
    - Chorus 2
    - Final Chorus
  priority_sections:
    - Final Chorus
    - Chorus 2
    - Chorus 1
  hero_shot_types:
    - EMOTION_CLOSE
    - CHAR_MASTER
  max_direct_face_ratio: 0.22
