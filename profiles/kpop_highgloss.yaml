# 화려한 실내 세트와 럭셔리한 비주얼이 강조된 정석적인 K-Pop 아이돌 뮤직비디오에 최적화
# Suggested Filename: kpop_highgloss.yaml
audio:
  language: ko
  tags:
    - glossy k-pop
    - young adult female solo vocal
    - polished confident lead vocal
    - punchy pop drums
    - sleek synth bass
    - bright hook topline
    - crisp rhythm guitar
    - high-shine chorus payoff
    - luxury pop finish
  brief: >
    Polished modern K-pop for a young adult female solo singer, with punchy pop drums, sleek
    synth bass, crisp rhythm guitar, and a bright high-impact hook. Keep the arrangement clean,
    premium, and direct, with clear dynamic lift into the chorus and strong mainstream visual-pop
    appeal instead of indie looseness or trap-heavy drag.
  hook_brief: >
    Build the hook around one instantly memorable phrase and make it clean, repeatable, and
    performance-ready in natural Korean. The hook should feel confident, addictive, and sharply
    visual rather than abstract or meandering.
audio_ending_policy:
  ending_mode: clean_resolve
  final_chorus_required: true
  outro_required: false
  ending_energy_drop: low
  ending_vocal_density: full
  ending_tags:
    - big final chorus
    - clean final hit
    - polished ending
visual:
  brief: >
    A photorealistic cinematic glossy K-pop music video with a young adult East Asian heroine,
    premium styling, a glamorous idol-grade camera presence, mirror-clean surfaces, luminous
    thresholds, sleek passages, and open performance lanes. Push the luxury pop finish through
    whip pan transitions, snap zoom hook
    punches, strobe accents, match-cut pose continuity, extreme close-up glam impact,
    high-contrast lighting, and dynamic shadows. Prioritize pristine center framing, clean set
    geometry, and premium wardrobe read before adding extra motion.
  negative: >
    Avoid grungy decay, sleepy wandering, random props, messy streetwear drift, muddy lighting,
    disconnected spaces, anime or 2D stylization, typography, text, subtitles, watermarks,
    logo, and UI overlay.
mv:
  story_world: >
    The video should feel like one controlled high-shine night world built from recurring
    environment families: reflective thresholds, sleek passages, polished platforms, and open
    performance lanes. The same heroine and the same luxurious pulse should hold through the
    whole piece.
  action_vocabulary: >
    Prefer readable pop actions: stepping into center, turning shoulders into light, holding a
    direct stare, pivoting through a lane, brushing past reflective walls, hitting a pose on the
    beat, and landing a strong stop. Keep motion sharp, clean, and legible rather than theatrical,
    overbusy, or too dance-rehearsal literal. Favor one clean motion idea per beat that can drop
    directly into downstream workflow prompts.
  payoff_style: >
    The final return should feel like total pop command: strongest center framing, cleaner
    lines, brighter reflections, stronger contrast, whip pan releases into snap zoom hook
    impacts, match-cut pose precision, restrained strobe flashes, and one extreme close-up.
  outro_feel: >
    End with a final held image that seals her control of the set like a last signature frame,
    polished, dominant, and impossible to shrink into a fade-out.
  avoid: >
    Avoid overcomplicated narrative acting, dull atmosphere, passive body language, random
    geography changes, and endings that shrink instead of peak.
visual_policy:
  visual_mode: character_heavy
  continuity_mode: same_heroine
  face_policy: selective
  shot_bias: performance
  ref_policy: identity_sensitive_only
  closeup_density: medium
  motion_density: high
  geography_mode: recurring_families
  anchor_mode: shot_anchor_required
  direct_face_sections:
    - Chorus 1
    - Chorus 2
    - Final Chorus
  priority_sections:
    - Final Chorus
    - Chorus 2
    - Chorus 1
  hero_shot_types:
    - EMOTION_CLOSE
    - CHAR_MASTER
  max_direct_face_ratio: 0.2
