audio:
  language: ko
  tags:
    - glossy k-pop
    - young adult female solo vocal
    - polished confident lead vocal
    - punchy pop drums
    - sleek synth bass
    - bright hook topline
    - crisp rhythm guitar
    - high-shine chorus payoff
    - luxury pop finish
  brief: >
    Polished modern K-pop for a young adult female solo singer, with punchy pop drums, sleek
    synth bass, crisp rhythm guitar, and a bright high-impact hook. Keep the arrangement clean,
    premium, and direct, with clear dynamic lift into the chorus and strong mainstream visual-pop
    appeal instead of indie looseness or trap-heavy drag.
  hook_brief: >
    Build the hook around one instantly memorable phrase and make it clean, repeatable, and
    performance-ready in natural Korean. The hook should feel confident, addictive, and sharply
    visual rather than abstract or meandering.
audio_ending_policy:
  ending_mode: clean_resolve
  final_chorus_required: true
  outro_required: false
  ending_energy_drop: low
  ending_vocal_density: full
  ending_tags:
    - big final chorus
    - clean final hit
    - polished ending
visual:
  brief: >
    Glossy premium K-pop at night with a rhythm-game and visual-MV sensibility. Favor polished
    platforms, reflective thresholds, sleek passages, performance lanes, and stacked light bands
    over heroine-only coverage.
  negative: >
    Avoid grunge decay, prop mess, random street drift, muddy light, cheap glamour, or geography
    changes that break the set-controlled polish.
mv:
  story_world: >
    One controlled high-shine night world built from polished platforms, reflective thresholds,
    open lanes, set edges, and clean passage geometry.
  action_vocabulary: >
    Prefer readable pop beats: stepping into center, direct stare, reflective pass, lane pivot,
    pose hit, shoulder turn into light, and strong stop.
  payoff_style: >
    The final return should feel like total pop command: clean center gravity, brighter set
    reflections, stronger contrast, and one decisive close-up inside an overall premium final
    hit.
  outro_feel: >
    End with a final held frame that feels like the whole stage seals around her.
  avoid: >
    Avoid dull atmosphere, passive body language, overcomplicated acting, random location drift,
    or endings that shrink instead of peak.
visual_policy:
  visual_mode: balanced
  continuity_mode: same_heroine
  face_policy: payoff_only
  shot_bias: object_symbol
  ref_policy: endpoints
  closeup_density: low
  motion_density: high
  geography_mode: recurring_families
  anchor_mode: shot_anchor_required
  visual_mv_mode: bga_event
  subject_exposure: selective
  motif_density: high
  graphic_event_density: high
  environment_event_density: high
  visual_payoff_mode: system_peak
  reflection_usage: selected_only
  palette_bias: glossy_pop
  motif_families:
    - stage strip
    - mirror panel
    - escalator light
    - runway edge
    - glass threshold
    - chrome rail
    - sign glow
    - floor reflection
  preferred_composition_families:
    - asymmetrical poster crop
    - floating object field
    - offset silhouette crop
    - low horizon silhouette
    - isolated small figure
    - sticker-cluster layout
  disfavored_composition_families:
    - split reflection diptych
    - centered two-body
    - bilateral symmetry
    - mirrored-face split
  direct_face_sections:
    - Final Chorus
  priority_sections:
    - Final Chorus
    - Chorus 2
  hero_shot_types:
    - CHAR_MASTER
    - EMOTION_CLOSE
  max_direct_face_ratio: 0.1
