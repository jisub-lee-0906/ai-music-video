prompt: >
  Late-night pop song about replaying the end of a relationship while walking through a wet city night.
  The emotion starts restrained and lonely, grows more direct in the chorus, tightens briefly before the bridge,
  and resolves with a clear forward release instead of collapsing into despair.
genre: "synth pop"
voice: "solo female, airy and emotional"
language: "ko"
visual_concept: >
  Realistic cinematic music video moving between rain-soaked city night exteriors,
  a dim retro diner, and a final open release space before dawn.
locations:
  - dim retro diner
  - wet city street at night
  - wide wet intersection at night
props:
  - worn notebook
  - half-empty coffee mug
  - studio headphones
anchor_subject: "young adult female vocalist"
anchor_hair: "long dark hair with soft volume and light face-framing strands"
anchor_top: "clean fitted knit top with a short polished outer layer"
anchor_bottom: "short skirt or slim premium denim bottom"
anchor_shoes: "premium everyday sneakers or slim ankle boots"
anchor_pose: "full-body standing pose, slight side angle, both hands visible, shoes fully visible"
anchor_background: "plain neutral studio background, no props, no environmental elements"
