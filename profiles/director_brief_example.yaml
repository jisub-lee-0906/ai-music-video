audio:
  language: ko
  tags:
    - polished korean girl-group pop
    - bright emotional female vocal
    - glossy synth-pop pulse
    - sparkling rhythm section
  brief: >
    Korean-language polished pop track with an immediate melodic hook, bright but emotional young adult female vocal,
    sparkling drums, glossy synth lift, and a clean euphoric chorus that can support a premium live-action music video.
  hook_brief: >
    The hook should be immediately singable, title-worthy, youthful, emotionally direct, and memorable after one listen.
visual:
  story_premise: >
    A cinematic live-action music video about one consistent Korean female idol heroine moving through one connected
    late-night station-side city block until her direction becomes physically undeniable.
  world_rules: >
    One connected late-night station-side world where thresholds, gates, stairs, platform edges, sidewalks, passages,
    and wet street surfaces always belong to the same walkable geography.
  heroine_arc: >
    She begins at a threshold, moves deeper through the same world, compresses without fully stopping, and ends by
    crossing into the widest forward release the world can give her.
  forbidden_story_moves: >
    Avoid abrupt geography breaks, random extra characters, symbolic abstraction replacing physical action, fashion-shoot
    emptiness, generic set-hopping, and any ending that turns into a static tableau instead of a concrete forward crossing.
  section_story_roles:
    Intro: The heroine crosses the first boundary into the connected night world.
    Verse 1: She moves deeper into the same world and lets the route define her direction.
    Verse 2: She varies her path inside the same world without breaking continuity.
    Pre-Chorus: She hesitates at a wider opening before committing to the next move.
    Chorus: She releases forward inside the same world with readable physical movement.
    Bridge: She compresses briefly without fully stopping, then regains direction.
    Final Chorus: She crosses into the widest forward release the world can hold.
    Outro: The world keeps her after-image after she has already passed through.
character:
  identity_core: >
    same heroine, Korean female idol in her twenties, long dark hair with soft volume and a high ponytail,
    airy see-through bangs, bright clear almond-shaped eyes, luminous natural makeup, balanced center-visual features,
    softly slim oval face, clean small nose line, polished off-duty idol outfit built from a fitted light knit top,
    a short clean casual outer layer, a soft short skirt or premium denim bottom, and premium everyday footwear in ivory,
    navy, and silver tones with one subtle metallic accent
  identity_hooks:
    - airy see-through bangs with high ponytail
    - soft face-framing strands around the jawline
    - polished ivory and navy off-duty idol silhouette with a short casual outer layer
    - subtle silver jewelry accent
  ref_subject_intro: >
    The same Korean female idol
  anchor_wardrobe_guidance: >
    Favor elevated off-duty idol styling such as a refined fitted knit or sleeveless top, a short clean casual jacket
    or soft cardigan, a soft mini skirt or premium denim bottom, premium sneakers or slim ankle boots, subtle jewelry,
    and airport-fashion-like coordination with polished casual luxury.
  anchor_avoid: >
    Avoid school-uniform prep, stiff formal blazers, office tailoring, loud graphic details, and costume-like stage styling.
  ref_continuity_guidance: >
    Keep the same heroine identity, realistic facial structure, consistent hair silhouette, stable wardrobe continuity,
    and single-subject on-screen continuity.
