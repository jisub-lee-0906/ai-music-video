audio:
  language: ko
  tags:
    - polished korean girl-group pop
    - bright emotional female vocal
    - glossy synth-pop pulse
    - sparkling rhythm section
  brief: >
    Korean-language polished pop track with an immediate melodic hook, bright but emotional young adult female vocal,
    sparkling drums, glossy synth lift, and a clean euphoric chorus that can support a premium live-action music video.
  hook_brief: >
    The hook should be immediately singable, title-worthy, youthful, emotionally direct, and memorable after one listen.
visual:
  brief: >
    Cinematic live-action music video with one consistent heroine, premium Korean idol beauty styling,
    natural skin and fabric response, polished city-night locations, and progression built from recurring urban motifs
    instead of generic fashion editorial severity.
  negative: >
    Avoid anime illustration, cel shading, toy-like CGI, empty studio space, random set-hopping,
    severe monochrome tailoring, harsh runway mood, and repetitive heroine-only coverage.
mv:
  story_world: >
    One recurring late-night station-front city block built from ticket gates, platform signs, stair landings,
    curb reflections, and puddle rings, with the same heroine moving through visibly connected zones and
    brighter polished pop-idol energy.
  action_vocabulary: >
    Favor visible actions such as stepping through gates, brushing hair back,
    turning at the curb, looking back over one shoulder, descending stairs, letting sleeves and hair react to motion,
    and crossing reflected light.
  payoff_style: >
    The final return should feel like a world-system peak where repeated city motifs align into one bright decisive idol image.
  outro_feel: >
    End on a lingering residual image where the space keeps glowing after the heroine passes through it.
  avoid: >
    Avoid abrupt geography breaks, empty abstract symbolism, random extra characters, cheap CGI spectacle,
    fashion-shoot emptiness, and overly stern luxury-brand stiffness.
character:
  identity_core: >
    same heroine, Korean female idol in her twenties, long dark hair with soft volume and a high ponytail,
    airy see-through bangs, bright clear almond-shaped eyes, luminous natural makeup, balanced center-visual features,
    softly slim oval face, clean small nose line, bright approachable smile line,
    polished off-duty idol outfit built from a fitted light knit top, a short clean casual outer layer,
    a soft short skirt or premium denim bottom, and premium everyday footwear in ivory, navy, and silver tones with one subtle metallic accent,
    slim readable silhouette
  ref_subject_intro: >
    The same Korean female idol
  identity_hooks:
    - airy see-through bangs with high ponytail
    - soft face-framing strands around the jawline
    - polished ivory and navy off-duty idol silhouette with a short casual outer layer
    - subtle silver jewelry accent
    - bright clear almond-shaped eyes
    - softly slim oval face with balanced center-visual proportions
  anchor_wardrobe_guidance: >
    Favor elevated off-duty idol styling such as a refined fitted knit or sleeveless top, a short clean casual jacket
    or soft cardigan, a soft mini skirt or premium denim bottom, premium sneakers or slim ankle boots,
    subtle jewelry, and airport-fashion-like coordination with polished casual luxury.
  anchor_avoid: >
    Avoid school-uniform prep, stiff formal blazers, office tailoring, loud graphic details, and costume-like stage styling.
  ref_continuity_guidance: >
    Keep the same heroine identity, realistic facial structure, consistent hair silhouette,
    and stable wardrobe continuity with clear silhouette separation and natural environmental depth.
director:
  target_style: >
    cinematic live-action Korean pop music video, premium commercial realism, natural skin response,
    polished beauty styling, grounded fabric detail, bright idol presence, and stable human continuity
  world_core: >
    layered urban transit night, readable foreground-background separation, recurring reflective surfaces,
    open-to-compressed zone progression, soft glamorous highlights, and consistent heroine continuity inside one connected city block
  camera_bias: >
    favor readable cinematic framing, flattering three-quarter angles, polished medium shots, occasional beauty close-ups,
    and wider chorus expansion
  lighting_bias: >
    favor flattering beauty light, sign glow, reflected floor light, platform lamps, sodium and LED mixes,
    and clean polished highlights
  shadow_bias: >
    use readable silhouette separation, soft grounded directional shadowing, and restrained contrast instead of harsh hard blocks
  motion_bias: >
    favor stable cinematic motion, reactive environment movement, hair and fabric flutter, reflected light drift,
    and clean pop-video camera movement
  transition_bias: >
    move between connected zones through threshold shots, reframed reflections, and previous-end continuity instead of hard resets
  ref_frame_style: >
    Premium cinematic live-action still frame, grounded environmental realism, and high-end music video keyframe quality.
  wan_motion_style: >
    stable cinematic motion with clean subject readability, reactive fabric and hair movement,
    and grounded environmental motion
  wan_negative: >
    morphing, melting, static, anatomy collapse, warped hands, extra limbs, identity drift, toy-like cgi
  motif_families:
    - platform sign glow
    - ticket gate
    - stair landing
    - curb reflection
    - puddle ring
  section_grammar:
    Intro: threshold setup and motif introduction
    Verse 1: object-led narrow world
    Verse 2: object-led variation inside the same world
    Pre-Chorus: threshold and anticipation
    Chorus: open world with wider motion
    Bridge: compressed interruption and reframing
    Final Chorus: motif system peak
    Outro: residual image and gentle release
