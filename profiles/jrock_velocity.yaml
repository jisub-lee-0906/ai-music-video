# 질주감 있는 하이템포 J-Rock 및 애니메이션 오프닝 스타일의 곡에 최적화
# Suggested Filename: jrock_velocity.yaml
audio:
  language: ja
  tags:
    - japanese anime rock
    - young adult female solo vocal
    - bright urgent lead vocal
    - driving electric guitar
    - live drum energy
    - melodic bass line
    - anthemic chorus hook
    - emotional lift
    - widescreen band feel
  brief: >
    High-energy Japanese anime-rock for a young adult female solo singer, with driving electric
    guitar, live drums, melodic bass, and a sharp hook that opens fast and lands hard. Keep the
    arrangement bright, urgent, and emotionally direct, with clear lift into the chorus and a
    strong forward-running pulse instead of loose jam-band drift.
  hook_brief: >
    Build the hook around one vivid emotional image and make it immediate, singable, and
    title-worthy in natural Japanese. The hook should feel bold, youthful, and cathartic rather
    than vague, sleepy, or overly delicate.
visual:
  brief: >
    A photorealistic cinematic J-rock heroine music video with a young adult East Asian lead,
    sharp styling, stunningly beautiful face, idol-like features, high-end fashion model
    aesthetic, wind-cut motion, reflective thresholds, elevated passages, and forward
    performance corridors. Push kinetic live-action energy with whip pan transitions, snap zoom
    pressure, extreme close-up punctuation, match cut body accents, strobe lighting hits, high
    contrast lighting, aggressive framing, and dynamic shadows. Favor fast pivots, rail turns,
    hard stops, shoulder snaps, and impact stares over literal running. Keep the heroine
    photogenic, energetic, consistent, and fashion-editorial luxurious, with determined
    live-action presence rather than editorial stillness, anime stylization, or 2D illustration
    cues.
  negative: >
    Avoid heavy nightclub glamour, luxury fashion drift, sluggish posing, random prop clutter,
    soft passive staging, disconnected environments, anime rendering, 2D illustration cues,
    typography, text, subtitles, watermarks, logo, and UI overlay.
mv:
  story_world: >
    The video should feel like one continuous emotional charge through recurring urban-night
    environment families: elevated passages, reflective thresholds, rooftop edges, and forward
    performance corridors. The same heroine and the same momentum should carry through the whole
    piece.
  action_vocabulary: >
    Prefer readable energetic actions: stepping into wind, pivoting on a threshold, bracing at a
    rail, snapping shoulders into light, cutting a sharp turn, lifting the chin into impact, and
    holding a forward stare. Keep motion physically simple but urgent rather than chaotic,
    repetitive sprinting, or fight-scene heavy.
  payoff_style: >
    The final return should feel like full emotional breakthrough in photorealistic cinematic
    live-action: stronger eye contact, wider body line, brighter backlight, sharper dynamic
    shadows, and a faster visual pulse built from whip pan releases, snap zoom escalations,
    strobe lighting bursts, match cut continuity, aggressive framing, and one extreme close-up
    impact before the final held corridor release.
  avoid: >
    Avoid sleepy wandering, static beauty posing, forced cuteness, random spectacle, muted
    endings, anime or 2D stylization, and any typography, text, subtitles, watermarks, logo, or
    UI overlay.
