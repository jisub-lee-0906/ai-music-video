# 질주감 있는 하이템포 J-Rock 및 애니메이션 오프닝 스타일의 곡에 최적화
# Suggested Filename: jrock_velocity.yaml
audio:
  language: ja
  tags:
    - japanese anime rock
    - young adult female solo vocal
    - bright urgent lead vocal
    - driving electric guitar
    - live drum energy
    - melodic bass line
    - anthemic chorus hook
    - emotional lift
    - widescreen band feel
  brief: >
    High-energy Japanese anime-rock for a young adult female solo singer, with driving electric
    guitar, live drums, melodic bass, and a sharp hook that opens fast and lands hard. Keep the
    arrangement bright, urgent, and emotionally direct, with clear lift into the chorus and a
    strong forward-running pulse instead of loose jam-band drift.
  hook_brief: >
    Build the hook around one vivid emotional image and make it immediate, singable, and
    title-worthy in natural Japanese. The hook should feel bold, youthful, and cathartic rather
    than vague, sleepy, or overly delicate.
visual:
  brief: >
    A photorealistic cinematic J-rock heroine music video with a young adult East Asian lead,
    sharp styling, a striking fashion-forward live-action presence, a beautiful high-impact
    camera read, wind-cut motion, reflective thresholds, elevated passages, and forward
    performance corridors. Keep the geography hard, readable, and lane-driven before extra
    aggression. Push kinetic camera energy
    with whip pans, snap zoom pressure, extreme close-up punctuation, match-cut body accents,
    strobe hits, high-contrast lighting, and dynamic shadows. Favor fast pivots, rail turns,
    hard stops, shoulder snaps, and impact stares over literal running.
  negative: >
    Avoid heavy nightclub glamour, sluggish posing, random prop clutter, soft passive staging,
    disconnected environments, anime or 2D stylization, typography, text, subtitles,
    watermarks, logo, and UI overlay.
mv:
  story_world: >
    The video should feel like one continuous emotional charge through recurring urban-night
    environment families: elevated passages, reflective thresholds, rooftop edges, and forward
    performance corridors. The same heroine and the same momentum should carry through the whole
    piece.
  action_vocabulary: >
    Prefer readable energetic actions: stepping into wind, pivoting on a threshold, bracing at a
    rail, snapping shoulders into light, cutting a sharp turn, lifting the chin into impact, and
    holding a forward stare. Keep motion physically simple but urgent rather than chaotic,
    repetitive sprinting, or fight-scene heavy. Favor compact beat-sized action clauses over
    over-described chase behavior.
  payoff_style: >
    The final return should feel like full emotional breakthrough: stronger eye contact, wider
    body line, brighter backlight, sharper shadows, faster visual pulse, and one extreme
    close-up impact before the final held corridor release.
  outro_feel: >
    End on a final forward-looking hold that feels earned and sealed, leaving a hard after-image
    that locks the arc in place instead of letting the energy simply drop away.
  avoid: >
    Avoid sleepy wandering, static beauty posing, forced cuteness, random spectacle, and muted
    endings.
