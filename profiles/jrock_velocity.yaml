audio:
  language: ko
  tags:
    - japanese anime rock
    - young adult female solo vocal
    - bright urgent lead vocal
    - driving electric guitar
    - live drum energy
    - melodic bass line
    - anthemic chorus hook
    - emotional lift
    - widescreen band feel
  brief: >
    High-energy Japanese anime-rock for a young adult female solo singer, with driving electric
    guitar, live drums, melodic bass, and a sharp hook that opens fast and lands hard. Keep the
    arrangement bright, urgent, and emotionally direct, with clear lift into the chorus and a
    strong forward-running pulse instead of loose jam-band drift.
  hook_brief: >
    Build the hook around one vivid emotional image and make it immediate, singable, and
    title-worthy in natural Japanese. The hook should feel bold, youthful, and cathartic rather
    than vague, sleepy, or overly delicate.
audio_ending_policy:
  ending_mode: anthem_lift
  final_chorus_required: true
  outro_required: true
  ending_energy_drop: medium
  ending_vocal_density: medium
  ending_tags:
    - anthemic final chorus
    - clean resolve
    - driving outro
visual:
  brief: >
    Anime-rock urgency with a rhythm-game and visual-MV sensibility moving through elevated
    lanes, rooftop edges, rail lines, and forward night corridors. Keep it bright, fast, and
    emotionally direct rather than ornamental or passive.
  negative: >
    Avoid nightclub glamour, sleepy posing, random props, soft passivity, disconnected spaces, or
    beauty-first staging that weakens the sense of forward drive.
mv:
  story_world: >
    One continuous charge through rails, rooftop passages, threshold edges, elevated walks, and
    night lanes that always feel like they are pulling forward.
  action_vocabulary: >
    Prefer compact urgent beats: stepping into wind, bracing at a rail, pivoting at a threshold,
    shoulder snap, chin lift, quick turn, and forward stare.
  payoff_style: >
    The final return should feel like breakthrough: wider body line, cleaner directional light,
    stronger motion energy, and a decisive heroine beat before the final release.
  outro_feel: >
    End on a final forward hold that feels earned, breathless, and sealed.
  avoid: >
    Avoid sleepy wandering, static posing, forced cuteness, random spectacle, or endings that
    flatten the momentum.
visual_policy:
  visual_mode: balanced
  continuity_mode: same_heroine
  face_policy: payoff_only
  shot_bias: object_symbol
  ref_policy: endpoints
  closeup_density: low
  motion_density: high
  geography_mode: recurring_families
  anchor_mode: shot_anchor_required
  visual_mv_mode: bga_event
  subject_exposure: selective
  motif_density: high
  graphic_event_density: high
  environment_event_density: high
  visual_payoff_mode: system_peak
  reflection_usage: selected_only
  palette_bias: anime_rock_neon
  motif_families:
    - rail line
    - rooftop edge
    - warning light
    - lane stripe
    - wind band
    - sign bar
    - stairwell seam
    - guitar shadow
  preferred_composition_families:
    - asymmetrical poster crop
    - low horizon silhouette
    - offset silhouette crop
    - isolated small figure
    - floating object field
    - sticker-cluster layout
  disfavored_composition_families:
    - split reflection diptych
    - centered two-body
    - bilateral symmetry
    - mirrored-face split
  direct_face_sections:
    - Final Chorus
  priority_sections:
    - Final Chorus
    - Chorus 2
  hero_shot_types:
    - CHAR_MASTER
    - EMOTION_CLOSE
  max_direct_face_ratio: 0.1
