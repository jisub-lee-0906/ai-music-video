# 90년대 빈티지한 질감과 거친 반항적 에너지가 느껴지는 얼터너티브 록 및 올드스쿨 힙합에 최적화
# Suggested Filename: retro_grunge.yaml
audio:
  language: en
  tags:
    - retro grunge rock
    - female solo vocal
    - gritty alternative energy
    - dirty guitar tone
    - heavy snare impact
    - old-school hip-hop edge
    - rebellious hook
    - analog texture
    - raw live feel
  brief: >
    A raw alternative-rock and old-school hip-hop hybrid for a female solo vocal, with dirty
    guitar tone, heavy snare hits, thick low-end attitude, and a hook that feels defiant and
    unforgettable. Keep the arrangement rough-edged, driving, and physical, with strong impact
    and throw instead of polished pop smoothness or overly modern trap drag.
  hook_brief: >
    Build the hook around one rebellious concrete image and make it immediate, repeatable, and
    sharp in natural English. The hook should feel dangerous, stubborn, and iconic rather than
    vague or overly polished.
visual:
  brief: >
    A photorealistic cinematic retro-grunge music video with an East Asian heroine, concrete
    walls, rusted cages, decayed corridors, 90s street textures, sodium-vapor shadows, rough
    practical light, a dangerous magnetic camera presence, and film-grain atmosphere. Keep the piece kinetic and brutal with smash
    reframe violence, hard-cut punctuation, whip pan breaks, snap zoom punches, dirty strobe
    hits, match-cut attitude poses, extreme close-up stare pressure, high-contrast lighting, and
    dynamic shadows that feel analog, urban, and confrontational. Keep the geography blunt and
    readable before layering grit.
  negative: >
    Avoid glossy futurism, luxury-only styling, clean sterile sets, random comedy props, weak
    lighting, typography, text, subtitles, watermarks, logo, UI overlay, and low-quality image
    artifacts.
mv:
  story_world: >
    The video should feel like one continuous rough urban world built from recurring environment
    families: concrete thresholds, rusted passages, dim street corners, chain-link boundaries,
    and wide asphalt lanes. The same heroine and the same rebellious force should hold through
    the whole piece.
  action_vocabulary: >
    Prefer readable hard-edged actions: kicking through a threshold, turning into camera with
    contempt, pacing a cracked lane, bracing against a rusted wall, cutting through shadow,
    shifting weight into a hard pose, and landing a final stance that feels untouchable. Keep
    motion blunt, physical, and forceful rather than stunt-heavy, sloppy, or over-choreographed.
    Favor compact physical beats over long narrative business.
  payoff_style: >
    The final return should feel like total retro-grunge impact: hardest silhouette, dirtiest
    light contrast, deeper shadows, smash reframe shocks, hard-cut attitude hits, whip pan
    interruptions, snap zoom impact, strobe flashes, match-cut pose aggression, and one extreme
    close-up.
  outro_feel: >
    End with one last defiant image that leaves a dirty after-image burned into the street
    world, like the ending has been nailed down rather than softened into a comedown.
  avoid: >
    Avoid polished idol sweetness, disconnected locations, fake vintage gimmicks, passive body
    language, and muted endings.
visual_policy:
  visual_mode: balanced
  continuity_mode: same_heroine
  face_policy: selective
  shot_bias: environment
  ref_policy: endpoints
  closeup_density: low
  motion_density: high
  geography_mode: recurring_families
  anchor_mode: shot_anchor_required
  direct_face_sections:
    - Final Chorus
  priority_sections:
    - Final Chorus
    - Chorus 2
    - Bridge
  hero_shot_types:
    - EMOTION_CLOSE
    - CHAR_MASTER
  max_direct_face_ratio: 0.14
