audio:
  language: ko
  tags:
    - retro grunge rock
    - female solo vocal
    - gritty alternative energy
    - dirty guitar tone
    - heavy snare impact
    - old-school hip-hop edge
    - rebellious hook
    - analog texture
    - raw live feel
  brief: >
    A raw alternative-rock and old-school hip-hop hybrid for a female solo vocal, with dirty
    guitar tone, heavy snare hits, thick low-end attitude, and a hook that feels defiant and
    unforgettable. Keep the arrangement rough-edged, driving, and physical, with strong impact
    and throw instead of polished pop smoothness or overly modern trap drag.
  hook_brief: >
    Build the hook around one rebellious concrete image and make it immediate, repeatable, and
    sharp in natural English. The hook should feel dangerous, stubborn, and iconic rather than
    vague or overly polished.
audio_ending_policy:
  ending_mode: hard_stop
  final_chorus_required: true
  outro_required: false
  ending_energy_drop: low
  ending_vocal_density: full
  ending_tags:
    - raw ending
    - dirty after-image
    - hard stop
visual:
  brief: >
    Retro-grunge night with a rhythm-game and visual-MV sensibility. Favor concrete thresholds,
    chain-link edges, rusted passages, dim street corners, and rough practical light systems
    over heroine-only coverage.
  negative: >
    Avoid glossy futurism, luxury styling, fake vintage gimmicks, comedy props, weak light, or
    clean sterile environments.
mv:
  story_world: >
    One rough urban world built from concrete thresholds, rusted passages, chain-link boundaries,
    dim corners, and wide asphalt lanes.
  action_vocabulary: >
    Prefer hard-edged readable beats: threshold kick, contempt turn, cracked-lane pace, wall
    brace, shadow cut, hard pose, and an untouchable final stance.
  payoff_style: >
    The final return should feel like total retro-grunge impact: hardest silhouette, dirtiest
    light contrast, smash-reframe force, and one hard final hit that stains the frame.
  outro_feel: >
    End with one last defiant image that leaves a dirty after-image in the street world.
  avoid: >
    Avoid polished sweetness, passive body language, disconnected locations, or endings that land
    softly.
visual_policy:
  visual_mode: balanced
  continuity_mode: same_heroine
  face_policy: payoff_only
  shot_bias: object_symbol
  ref_policy: endpoints
  closeup_density: low
  motion_density: high
  geography_mode: recurring_families
  anchor_mode: shot_anchor_required
  visual_mv_mode: bga_event
  subject_exposure: selective
  motif_density: high
  graphic_event_density: high
  environment_event_density: high
  visual_payoff_mode: system_peak
  reflection_usage: selected_only
  palette_bias: dirty_analog
  motif_families:
    - chain-link edge
    - rust stripe
    - cracked lane
    - sodium lamp
    - concrete seam
    - spray mark
    - puddle smear
    - fence shadow
  preferred_composition_families:
    - asymmetrical poster crop
    - low horizon silhouette
    - offset silhouette crop
    - floating object field
    - isolated small figure
    - sticker-cluster layout
  disfavored_composition_families:
    - split reflection diptych
    - centered two-body
    - bilateral symmetry
    - mirrored-face split
  direct_face_sections:
    - Final Chorus
  priority_sections:
    - Final Chorus
    - Chorus 2
    - Bridge
  hero_shot_types:
    - EMOTION_CLOSE
    - CHAR_MASTER
  max_direct_face_ratio: 0.1
