audio:
  language: ja
  tags:
    - japanese city pop
    - young adult female solo vocal
    - fresh elegant lead vocal
    - glossy electric piano
    - tasteful chorus guitar
    - warm analog synth pad
    - fretless bass groove
    - subtle disco bounce
    - soft backing harmonies
    - light string accents
    - smooth melodic hook
    - elegant city-pop groove
  brief: >
    Retro Japanese city-pop for a young adult female solo singer, with glossy electric piano,
    tasteful chorus guitar, warm analog synth pad, fretless bass groove, soft backing harmonies,
    and a subtle disco bounce. Keep the arrangement fresh, elegant, and polished, with a
    smooth melodic lift and clear mainstream appeal instead of modern trap aggression or generic
    alt-pop drift.
  hook_brief: >
    Build the hook from one concrete late-night city image and make it title-worthy, memorable
    after one listen, and singable in natural Japanese. The hook should feel adult, graceful,
    and emotionally inevitable rather than slogan-like or generic.
audio_ending_policy:
  ending_mode: glow_fade
  final_chorus_required: true
  outro_required: true
  ending_energy_drop: medium
  ending_vocal_density: low
  ending_tags:
    - soft outro
    - warm final resolve
    - gentle fade out
visual:
  brief: >
    City-pop with a rhythm-game and visual-MV sensibility. Keep it polished, detached, and
    motif-driven. Favor train windows, ticket gates, curb edges, puddle rings, vending glow,
    lane cuts, and off-center city geometry over heroine-only coverage.
  negative: >
    Avoid random spectacle, cheap club styling, location chaos, empty glamour coverage, clutter
    without motif purpose, or big visual ideas that do not belong to the same city block.
mv:
  story_world: >
    One recurring city-night block built from train-window bands, ticket-gate shapes, puddle
    rings, umbrella tips, vending glow, curb lines, and quiet public surfaces. The same heroine
    stays inside the same world, but not every beat needs to be heroine-first.
  action_vocabulary: >
    Prefer image-events over performance coverage: window trace, lane cut, puddle hit, gate pass,
    phone-light accent, vending glow pause, rail-shadow slide, off-center figure turn, and one
    clear visual hit per beat.
  payoff_style: >
    The final return should feel like a city-motif system peak: repeated objects and light bands
    lock together, heroine presence returns inside the whole system, and the image resolves as a
    visual MV climax rather than a simple close-up.
  outro_feel: >
    End on a polished residual city image where motifs and heroine presence linger together.
  avoid: >
    Avoid random idol coverage, geography resets with no setup, cluttered symbolism, or endings
    that lose the city-motif thread.
visual_policy:
  visual_mode: balanced
  continuity_mode: same_heroine
  face_policy: payoff_only
  shot_bias: object_symbol
  ref_policy: endpoints
  closeup_density: low
  motion_density: medium
  geography_mode: recurring_families
  anchor_mode: shot_anchor_required
  visual_mv_mode: bga_event
  subject_exposure: selective
  motif_density: high
  graphic_event_density: high
  environment_event_density: high
  visual_payoff_mode: system_peak
  reflection_usage: selected_only
  palette_bias: retro_pop_neon
  motif_families:
    - train window
    - curb edge
    - puddle ring
    - umbrella tip
    - ticket gate
    - vending glow
    - phone light
    - rail shadow
  preferred_composition_families:
    - asymmetrical poster crop
    - low horizon silhouette
    - floating object field
    - isolated small figure
    - offset silhouette crop
    - sticker-cluster layout
  disfavored_composition_families:
    - split reflection diptych
    - centered two-body
    - bilateral symmetry
    - mirrored-face split
  direct_face_sections:
    - Final Chorus
  priority_sections:
    - Final Chorus
    - Chorus 2
  hero_shot_types:
    - CHAR_MASTER
    - EMOTION_CLOSE
  max_direct_face_ratio: 0.1
