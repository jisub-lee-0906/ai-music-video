audio:
  language: ja
  tags:
    - japanese city pop
    - female solo vocal
    - mature graceful lead vocal
    - glossy electric piano
    - tasteful chorus guitar
    - warm analog synth pad
    - fretless bass groove
    - subtle disco bounce
    - soft backing harmonies
    - light string accents
    - smooth melodic hook
    - elegant city-pop groove
  brief: >
    Retro Japanese city-pop for a mature female solo singer, with glossy electric piano,
    tasteful chorus guitar, warm analog synth pad, fretless bass groove, soft backing harmonies,
    and a subtle disco bounce. Keep the arrangement elegant, romantic, and polished, with a
    smooth melodic lift instead of modern trap aggression or generic alt-pop drift.
  hook_brief: >
    Build the hook from one concrete late-night city image and make it title-worthy, memorable
    after one listen, and singable in natural Japanese. The hook should feel adult, graceful,
    and emotionally inevitable rather than slogan-like or generic.
visual:
  brief: >
    A refined nostalgic nightlife music video with an East Asian heroine, elegant adult romance,
    polished retro city-pop glamour, wet pavement reflections, station glass, storefront glow,
    and late-night crosswalk light. Keep the wardrobe sophisticated and consistent, and make the
    world feel like one coherent urban night rather than many disconnected locations.
  negative: >
    Avoid futuristic sci-fi tone, cheap club styling, noisy streetwear drift, random location
    hopping, heavy prop emphasis, and fashion-editorial posing that breaks music-video continuity.
mv:
  story_world: >
    The video should feel like one late-night emotional passage through a small set of recurring
    city spaces: station glass, storefront pavement, and an open neon crosswalk. The same night,
    the same heroine, and the same emotional weather should carry through the whole piece.
  action_vocabulary: >
    Prefer readable small actions: slowing by the glass, passing the storefront, pausing at the
    curb, checking a reflection, stepping forward into open light, and holding a gaze. Keep motion
    graceful and physically simple rather than plot-heavy or theatrical.
  payoff_style: >
    The final return should feel like emotional arrival inside the same city night: clearer eye
    contact, more open posture, brighter reflections, and a sense that the heroine and the street
    have finally locked into the same beat.
  avoid: >
    Avoid random spectacle, abrupt geography changes, disconnected glam shots, and endings that
    feel fragmentary instead of gently resolved.
