# 하이테크 사이버펑크 무드와 네온 조명이 강조된 일렉트로니카 및 퓨처 베이스 장르에 최적화
# Suggested Filename: cyber_neon.yaml
audio:
  language: en
  tags:
    - cyber future bass
    - female solo vocal
    - sleek electro topline
    - hard syncopated drums
    - neon synth bass
    - glitch accents
    - futuristic hook design
    - high-energy drop
    - cinematic electronic finish
  brief: >
    High-energy electro-pop and future bass for a female solo vocal, with hard syncopated drums,
    neon synth bass, sharp digital accents, and a hook that feels immediate, bright, and
    futuristic. Keep the arrangement precise, glossy, and aggressive, with strong drop lift and
    forward momentum instead of ambient drift or soft EDM wash.
  hook_brief: >
    Build the hook around one vivid high-tech image and make it instantly memorable, chantable,
    and clean in natural English. The hook should feel sleek, addictive, and electrically alive
    rather than vague or over-written.
visual:
  brief: >
    A photorealistic cinematic cyber-neon music video with an East Asian heroine, a sleek
    fashion-forward live-action presence, a striking camera-ready face, neon green and magenta
    light, hologram-like reflections, rain-slick cyber streets, mirrored tech corridors, and
    glowing urban depth. Keep the frame premium and readable rather than overloaded with props or
    interfaces. Drive
    the visuals with snap zoom attacks on high-tech detail, whip pan transitions through neon
    lanes, digital-noise strobe bursts, match-cut pose continuity, extreme close-up eye locks,
    high-contrast lighting, and dynamic shadows.
  negative: >
    Avoid cheap sci-fi props, toy-like cyber gear, flat lighting, muddy color, random world
    clutter, typography, text, subtitles, watermarks, logo, UI overlay, and low-quality image
    artifacts.
mv:
  story_world: >
    The video should feel like one continuous cyberpunk night world built from recurring
    environment families: neon alleys, reflective server corridors, holographic thresholds, and
    luminous high-rise walkways. The same heroine and the same electric pressure should hold
    through the whole piece.
  action_vocabulary: >
    Prefer readable high-tech actions: stepping through a lit threshold, locking eyes through a
    neon haze, turning into a corridor flash, brushing a glowing wall, cutting across a
    circuit-lit lane, and landing a final stare like a system override. Keep motion crisp,
    forceful, and camera-readable rather than chaotic, cluttered, or fight-scene heavy.
  payoff_style: >
    The final return should feel like total cyber-neon domination: strongest eye line, hardest
    silhouette, brighter green-magenta contrast, sharper shadows, snap zoom pressure on key tech
    details, whip pan lane attacks, digital-noise strobe bursts, and one extreme close-up
    impact.
  outro_feel: >
    End with a decisive after-image, like the city has been overridden by her presence, not with
    a vague fade into ambient neon.
  avoid: >
    Avoid soft ambient drift, disconnected locations, random hacker clichés, flat commercial
    beauty shots, and diluted endings.
