audio:
  language: ko
  tags:
    - cyber future bass
    - female solo vocal
    - sleek electro topline
    - hard syncopated drums
    - neon synth bass
    - glitch accents
    - futuristic hook design
    - high-energy drop
    - cinematic electronic finish
  brief: >
    High-energy electro-pop and future bass for a female solo vocal, with hard syncopated drums,
    neon synth bass, sharp digital accents, and a hook that feels immediate, bright, and
    futuristic. Keep the arrangement precise, glossy, and aggressive, with strong drop lift and
    forward momentum instead of ambient drift or soft EDM wash.
  hook_brief: >
    Build the hook around one vivid high-tech image and make it instantly memorable, chantable,
    and clean in natural English. The hook should feel sleek, addictive, and electrically alive
    rather than vague or over-written.
audio_ending_policy:
  ending_mode: clean_resolve
  final_chorus_required: true
  outro_required: false
  ending_energy_drop: low
  ending_vocal_density: medium
  ending_tags:
    - final impact
    - system-locked ending
    - clean final hit
visual:
  brief: >
    Cyber-neon pressure at night with a rhythm-game and visual-MV sensibility. Favor server
    corridors, glowing lane cuts, reflective tech surfaces, stacked UI bands, and hard electric
    contrast over heroine-only coverage. Keep it sleek, premium, and exact rather than cluttered
    or toy-like.
  negative: >
    Avoid cheap gadget clutter, soft EDM dreaminess, random hacker stereotypes, messy geography,
    diluted glamour, or visual noise that weakens the system-locked tone.
mv:
  story_world: >
    One continuous cyber-neon world built from server bands, tech thresholds, luminous walkways,
    reflective walls, and compressed electronic corridors.
  action_vocabulary: >
    Prefer clear high-tech beats: threshold override, corridor flash turn, signal flicker, lane
    cut, wall pass, scan hold, and one decisive motion idea per beat.
  payoff_style: >
    The final return should feel like a system override: hardest contrast, strongest lane energy,
    a cleaner locked-in pose, and heroine presence inside a larger electric-world peak.
  outro_feel: >
    End with a sealed after-image, as if the whole system has snapped into final alignment.
  avoid: >
    Avoid soft drift, disconnected locations, costume-only cyber styling, weak drop visuals, or
    endings that lose tension before the finish.
visual_policy:
  visual_mode: balanced
  continuity_mode: same_heroine
  face_policy: payoff_only
  shot_bias: object_symbol
  ref_policy: endpoints
  closeup_density: low
  motion_density: high
  geography_mode: recurring_families
  anchor_mode: shot_anchor_required
  visual_mv_mode: bga_event
  subject_exposure: selective
  motif_density: high
  graphic_event_density: high
  environment_event_density: high
  visual_payoff_mode: system_peak
  reflection_usage: selected_only
  palette_bias: cyber_neon
  motif_families:
    - server band
    - scan line
    - signal strip
    - corridor glow
    - glass panel
    - gate seam
    - hologram ring
    - warning lamp
  preferred_composition_families:
    - asymmetrical poster crop
    - floating object field
    - offset silhouette crop
    - low horizon silhouette
    - sticker-cluster layout
    - isolated small figure
  disfavored_composition_families:
    - split reflection diptych
    - centered two-body
    - bilateral symmetry
    - mirrored-face split
  direct_face_sections:
    - Final Chorus
  priority_sections:
    - Final Chorus
    - Chorus 2
  hero_shot_types:
    - CHAR_MASTER
    - EMOTION_CLOSE
  max_direct_face_ratio: 0.1
