audio:
  language: ko
  tags:
    - ethereal future pop
    - female solo vocal
    - airy layered topline
    - elegant electronic drums
    - shimmering synth texture
    - emotional lift
    - cinematic electronic bloom
    - dreamy hook
    - lyrical electro atmosphere
  brief: >
    Dreamy future-pop and lyrical electronic music for a female solo vocal, with elegant drums,
    shimmering synth layers, floating harmonic lift, and a hook that blooms with emotional
    clarity. Keep the arrangement luminous, modern, and fluid, with real forward motion instead
    of sleepy ambient wash or over-minimal restraint.
  hook_brief: >
    Build the hook around one luminous emotional image and make it immediate, singable, and
    memorable in natural English. The hook should feel graceful, transporting, and emotionally
    open rather than generic or shapeless.
audio_ending_policy:
  ending_mode: glow_fade
  final_chorus_required: true
  outro_required: true
  ending_energy_drop: high
  ending_vocal_density: low
  ending_tags:
    - luminous outro
    - final resolve
    - lingering fade
visual:
  brief: >
    Luminous dream-pop with a rhythm-game and visual-MV sensibility. Favor reflective planes,
    soft threshold glow, open corridors of light, drifting haze bands, and floating light systems
    over heroine-only coverage.
  negative: >
    Avoid muddy haze, childish fantasy clutter, vague emptiness, washed-out color, random props,
    or beauty coverage with no environmental logic.
mv:
  story_world: >
    One luminous dream-world built from reflective white thresholds, glowing lanes, pale chamber
    edges, and open fields of light. The world should feel continuous and lucid rather than
    random or decorative.
  action_vocabulary: >
    Prefer graceful readable beats: crossing a reflective plane, entering a light field, turning
    through haze, pausing at a flare edge, and one lucid motion per beat.
  payoff_style: >
    The final return should feel like ethereal impact through cleaner contrast, wider glow bands,
    a more legible heroine beat, and one luminous system-wide image rather than only face payoff.
  outro_feel: >
    End with one final image that hangs in memory like the light remains after the body passes.
  avoid: >
    Avoid sleepy aimlessness, empty fantasy symbolism, disconnected locations, or endings that
    blur instead of resolve.
visual_policy:
  visual_mode: balanced
  continuity_mode: same_heroine
  face_policy: payoff_only
  shot_bias: object_symbol
  ref_policy: endpoints
  closeup_density: low
  motion_density: medium
  geography_mode: recurring_families
  anchor_mode: shot_anchor_required
  visual_mv_mode: bga_event
  subject_exposure: selective
  motif_density: high
  graphic_event_density: high
  environment_event_density: high
  visual_payoff_mode: system_peak
  reflection_usage: selected_only
  palette_bias: luminous_dream
  motif_families:
    - light band
    - haze strip
    - glass plane
    - chamber edge
    - halo ring
    - pale corridor
    - flare seam
    - reflection field
  preferred_composition_families:
    - asymmetrical poster crop
    - floating object field
    - isolated small figure
    - offset silhouette crop
    - low horizon silhouette
    - sticker-cluster layout
  disfavored_composition_families:
    - split reflection diptych
    - centered two-body
    - bilateral symmetry
    - mirrored-face split
  direct_face_sections:
    - Final Chorus
  priority_sections:
    - Final Chorus
    - Chorus 2
  hero_shot_types:
    - EMOTION_CLOSE
    - CHAR_MASTER
  max_direct_face_ratio: 0.1
