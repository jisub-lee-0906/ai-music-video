[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-mv"
version = "0.1.0"
description = "Concept-text-first ComfyUI music-video orchestration CLI with music generation and review/rerender loops"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML==6.0.2",
  "requests==2.33.0",
  "jsonschema==4.23.0",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "librosa>=0.11,<1",
  "soundfile>=0.13,<1",
]

[project.optional-dependencies]
dev = ["build", "pytest==9.0.3"]

[project.scripts]
ai-mv = "ai_mv.cli.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
